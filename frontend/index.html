<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoltSonic</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary-fixed-dim": "var(--primary)",
              "tertiary-fixed-dim": "var(--secondary)",
              "on-surface": "#dee5ff",
              "on-secondary-fixed-variant": "#d7e8dc",
              "on-primary-fixed": "var(--primary-foreground)",
              "surface-container": "var(--card)",
              "error-container": "#b92902",
              "tertiary-fixed": "var(--secondary)",
              "on-primary-container": "var(--primary-foreground)",
              "surface-bright": "var(--muted)",
              primary: "var(--primary)",
              "on-tertiary-fixed-variant": "var(--foreground)",
              "on-primary": "var(--primary-foreground)",
              tertiary: "var(--secondary)",
              "surface-container-lowest": "#000000",
              "surface-container-high": "var(--card)",
              "inverse-on-surface": "#4d556b",
              "on-primary-fixed-variant": "var(--primary-foreground)",
              "inverse-primary": "var(--primary)",
              "secondary-fixed-dim": "var(--secondary)",
              "on-error-container": "#ffd2c8",
              background: "var(--background)",
              "error-dim": "#d53d18",
              "tertiary-container": "#8f60fa",
              outline: "#6d758c",
              "inverse-surface": "#faf8ff",
              "primary-dim": "var(--primary)",
              "primary-fixed": "var(--primary)",
              "on-secondary-fixed": "var(--secondary-foreground)",
              "on-error": "#450900",
              "secondary-dim": "var(--secondary)",
              "on-tertiary-container": "#000000",
              "secondary-fixed": "var(--secondary)",
              "on-tertiary": "var(--secondary-foreground)",
              "on-tertiary-fixed": "var(--secondary-foreground)",
              "outline-variant": "#40485d",
              error: "#ff7351",
              "surface-tint": "var(--primary)",
              "surface-dim": "var(--background)",
              "surface-container-highest": "var(--muted)",
              "on-background": "#dee5ff",
              "surface-container-low": "var(--background)",
              "secondary-container": "var(--secondary)",
              "primary-container": "var(--primary)",
              surface: "var(--background)",
              "on-secondary": "var(--secondary-foreground)",
              "on-surface-variant": "#a3aac4",
              "on-secondary-container": "var(--secondary-foreground)",
              "tertiary-dim": "var(--secondary)",
              "surface-variant": "var(--muted)",
              secondary: "var(--secondary)",
            },
            fontFamily: {
              headline: ["Space Grotesk"],
              body: ["Manrope"],
              label: ["Space Grotesk"],
            },
            borderRadius: {
              DEFAULT: "0px",
              lg: "0px",
              xl: "0px",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .text-muted-foreground {
        color: hsl(var(--muted-foreground));
      }

      ring-primary\/40 {
    @supports (color: color-mix(in lab, red, red)) {
        --tw-ring-color: 
      color-mix(in oklab, var(--primary) 40%, transparent);
    }
}
.ring-primary\/40 {
    --tw-ring-color: var(--primary);
}
.ring-1 {
    --tw-ring-shadow: var(--tw-ring-inset, ) 0 0 0 calc(1px + var(--tw-ring-offset-width)) var(--tw-ring-color, currentcolor);
    box-shadow: var(--tw-inset-shadow), var(--tw-inset-ring-shadow), var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow);
}

.text-center {
    text-align: center;
}
.bg-primary\/15 {
    @supports (color: color-mix(in lab, red, red)) {
        background-color: 
      color-mix(in oklab, var(--primary) 15%, transparent);
    }
}
.bg-primary\/15 {
  background-color: color-mix(in oklch, var(--primary) 15%, transparent);
}
.border-primary {
    border-color: var(--primary);
}
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
  </html>
